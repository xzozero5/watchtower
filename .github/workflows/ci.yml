# Watchtower CI (T-014).
#
# Four jobs run in parallel. None needs a repository secret: the only credential is the workflow's
# own read-only GITHUB_TOKEN. Everything the jobs need (service containers, a throwaway database,
# break-glass account, JWT and encryption keys) is local to the runner and created at run time.
#
#   static     lint + typecheck + unit tests
#   integration  pnpm test:integration against Postgres (pgvector), Redis and Mailpit service containers
#   e2e        Playwright UI tests (api mocked) + the full-stack e2e from source (real web, api, worker)
#   compose    docker compose build, up --wait, probe /health of every published port, down -v
#
# Service-container images match docker-compose.yml, so CI and a laptop run the same versions.
# Third-party actions are pinned by full commit SHA (the version is in the comment).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_USER: watchtower
          POSTGRES_PASSWORD: watchtower
          POSTGRES_DB: watchtower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchtower -d watchtower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://watchtower:watchtower@127.0.0.1:5432/watchtower
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_USER: watchtower
          POSTGRES_PASSWORD: watchtower
          POSTGRES_DB: watchtower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchtower -d watchtower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # tools/e2e-stack/up.mjs creates a throwaway database on this server and generates the
      # JWT secret, encryption key and break-glass password itself; none is printed.
      TEST_DATABASE_URL: postgres://watchtower:watchtower@127.0.0.1:5432/watchtower
      E2E_REDIS_URL: redis://127.0.0.1:6379/9
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      E2E_SMTP_HOST: 127.0.0.1
      E2E_SMTP_PORT: '1025'
      # Keep api / worker / web logs of the stack after the run so a failed job can upload them.
      E2E_KEEP_LOGS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download happens here, in CI only. It is not part of the product or its images.
      - name: Install Chromium for Playwright
        run: pnpm --filter @watchtower/web exec playwright install --with-deps chromium
      - name: Web e2e (UI against a mocked api)
        run: pnpm test:e2e
      - name: Full-stack e2e (from source, real api + worker + web)
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:fullstack
      # Failure only. The HTML reports contain traces: they can show what the throwaway stack's
      # generated break-glass password looked like, which dies with the job. Retention is short.
      - name: Upload Playwright reports and stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report-fullstack/
            apps/web/test-results/
            apps/web/test-results-fullstack/
            /tmp/wt-e2e-stack-*/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Docker Compose build, up, health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runtime credentials: random per run, masked before they are written anywhere, never echoed.
      - name: Generate runtime credentials
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -base64 48)"
          encryption_key="$(openssl rand -base64 32)"
          break_glass_password="$(openssl rand -hex 24)"
          echo "::add-mask::${jwt_secret}"
          echo "::add-mask::${encryption_key}"
          echo "::add-mask::${break_glass_password}"
          {
            echo "JWT_SECRET=${jwt_secret}"
            echo "APP_ENCRYPTION_KEY=${encryption_key}"
            echo "BREAK_GLASS_EMAIL=ci-admin@example.com"
            echo "BREAK_GLASS_PASSWORD=${break_glass_password}"
          } >> "$GITHUB_ENV"
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 300
      - name: Probe health through the published ports
        run: |
          set -euo pipefail
          probe() {
            curl --fail --silent --show-error --max-time 10 \
              --retry 10 --retry-delay 3 --retry-connrefused \
              --output /dev/null --write-out "%{http_code} $1\n" "$1"
          }
          probe http://127.0.0.1:4000/health        # api liveness
          probe http://127.0.0.1:4000/health/ready  # api: Postgres + Redis answer
          probe http://127.0.0.1:4100/health/ready  # worker
          probe http://127.0.0.1:3000/health        # web
          probe http://127.0.0.1:8080/health        # web through Caddy
      - name: Show service state and recent logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
      - name: Tear down (containers, networks, volumes)
        if: always()
        run: docker compose down --volumes --remove-orphans

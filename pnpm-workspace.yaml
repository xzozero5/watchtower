packages:
  - 'apps/*'
  - 'packages/*'
  - 'evals/*'

# One version of each shared dev tool across the workspace. Reference with "catalog:".
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^22.0.0
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  prettier: ^3.9.10
  turbo: ^2.11.10
  # typescript-eslint 8.72 declares typescript <6.1.0, so TypeScript 7 is not usable yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  vitest: ^5.0.5

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Canvas (Sampled: #F7F7ED) -->
    <rect id="bg" width="1024" height="1024" fill="#F7F7ED" />

    <!-- Warm Golden Light Beam (Sampled: #FFFAE6) -->
    <linearGradient id="warmLightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFAE6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FDE8B3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FDE8B3" stop-opacity="0" />
    </linearGradient>

    <!-- Coral Red Shading (Sampled: #E5594A to #F67963) -->
    <linearGradient id="coralRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5594A" />
      <stop offset="60%" stop-color="#F67963" />
      <stop offset="100%" stop-color="#E5594A" />
    </linearGradient>

    <!-- Warm Ivory Shading (Sampled: #F7F0D4) -->
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4EBC8" />
      <stop offset="50%" stop-color="#FDFBF0" />
      <stop offset="100%" stop-color="#F4EBC8" />
    </linearGradient>

    <!-- Midnight Slate Navy Dome (Sampled: #1D2739 to #0F172A) -->
    <linearGradient id="midnightDomeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1D2739" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Seafoam Waves (Sampled: #B2E4D8 and #80CFC0) -->
    <linearGradient id="seaWaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76C4B4" />
      <stop offset="50%" stop-color="#B2E4D8" />
      <stop offset="100%" stop-color="#76C4B4" />
    </linearGradient>
    <linearGradient id="seaWaveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8AD5C6" />
      <stop offset="50%" stop-color="#C2EFE5" />
      <stop offset="100%" stop-color="#8AD5C6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <use href="#bg" />

  <!-- ========================================== -->
  <!-- LIGHTHOUSE MARK (Centered horizontally at x=512) -->
  <!-- ========================================== -->
  <g id="lighthouse-mark">
    <!-- Golden Light Beam -->
    <polygon points="536,290 850,200 850,370 536,315" fill="url(#warmLightBeam)" />

    <!-- Tapered Tower Body -->
    <!-- Stripe 1 (Base - Coral Red) -->
    <polygon points="428,580 596,580 584,500 440,500" fill="url(#coralRedGrad)" />
    <!-- Stripe 2 (Ivory Cream) -->
    <polygon points="440,500 584,500 572,425 452,425" fill="url(#ivoryGrad)" />
    <!-- Stripe 3 (Upper - Coral Red) -->
    <polygon points="452,425 572,425 560,355 464,355" fill="url(#coralRedGrad)" />
    <!-- Stripe 4 (Top Collar - Ivory Cream) -->
    <polygon points="464,355 560,355 554,320 470,320" fill="url(#ivoryGrad)" />

    <!-- Charcoal Door at Base -->
    <path d="M 494,580 L 494,525 Q 512,508 530,525 L 530,580 Z" fill="#2B303A" />

    <!-- Balcony Railing Deck (Midnight Navy) -->
    <rect x="450" y="306" width="124" height="15" rx="4" fill="#0F172A" />

    <!-- Lantern Room (Warm Golden Glow) -->
    <rect x="472" y="260" width="80" height="48" rx="4" fill="#FFFAE6" stroke="#E5B55E" stroke-width="2.5" />
    <circle cx="512" cy="284" r="14" fill="#F59E0B" />
    <circle cx="512" cy="284" r="7" fill="#FFFFFF" />

    <!-- Midnight Slate Dome Roof (#1D2739 / #0F172A) -->
    <path d="M 462,260 Q 512,176 562,260 Z" fill="url(#midnightDomeGrad)" />
    <circle cx="512" cy="180" r="9" fill="#0F172A" />

    <!-- Sea Waves at Base (Soft Pastel Seafoam #B2E4D8) -->
    <!-- Wave Layer 1 -->
    <path d="M 310,595 Q 380,572 450,596 Q 520,572 590,596 Q 660,574 714,595 L 714,618 L 310,618 Z" fill="url(#seaWaveGrad1)" />
    <!-- Wave Layer 2 -->
    <path d="M 345,612 Q 415,590 495,614 Q 575,590 650,612 Q 675,603 695,612 L 695,630 L 345,630 Z" fill="url(#seaWaveGrad2)" />
  </g>

  <!-- ========================================== -->
  <!-- WORDMARK: Exact single line "Watchtower" -->
  <!-- Uniform Charcoal Color (#363839) - NO Badges, NO Subtitle -->
  <!-- ========================================== -->
  <g id="wordmark">
    <text x="512" y="828" 
          text-anchor="middle" 
          fill="#363839" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="82" 
          font-weight="700" 
          letter-spacing="1">Watchtower</text>
  </g>
</svg>

# Debug overlay for the local embedder (ADR-030): publishes it on the loopback of THIS machine so
# `pnpm --filter @watchtower/eval-runner kb-similarity` (docs/runbooks/local-poc.md section 3c) can
# reach it from the host. Use it only for that step, then start the stack again without this file:
#   docker compose -f docker-compose.yml -f docker-compose.embedder-debug.yml --profile ai up -d embedder
#   docker compose --profile ai up -d embedder
# The port is bound to 127.0.0.1 only. The embedder has no authentication, so never bind it wider.
services:
  embedder:
    ports:
      - '127.0.0.1:${EMBEDDER_DEBUG_PORT:-11434}:11434'

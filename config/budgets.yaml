# งบ — ค่าเริ่มต้น [ASSUMED] เจ้าของแก้ได้ · เกินเพดาน = [ASK-HUMAN]
build_ai:            # AI ที่ใช้สร้างโปรเจกต์ (Claude Code ฯลฯ)
  per_session_usd: 10
  per_month_usd: 150

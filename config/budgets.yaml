# งบ — ค่าเริ่มต้น [ASSUMED] เจ้าของแก้ได้ · เกินเพดาน = [ASK-HUMAN]
build_ai:            # AI ที่ใช้สร้างโปรเจกต์ (Claude Code ฯลฯ)
  per_session_usd: 10
  per_month_usd: 150
app_ai_dev:          # เรียก provider จริงจาก Watchtower ระหว่าง dev/eval
  per_session_usd: 2
  per_month_usd: 30
app_ai_daily:        # [ASSUMED] เพดานต่อวัน (UTC) ที่ Watchtower เรียก provider จริง · เตือนที่ alert_percent, หยุดที่เพดาน (fail closed → rules)
  usd: 1             # ทับด้วย AI_DAILY_COST_CAP_USD · ค่าเดียวกับ DEFAULT_AI_DAILY_COST_CAP_USD ใน packages/domain
  tokens: 500000     # ทับด้วย AI_DAILY_TOKEN_CAP · นับเฉพาะ LLM (ไม่นับ embedding)
  embedding_tokens: 5000000  # [ASSUMED] เพดาน embedding ของตัวเอง (ADR-030, T-435) ทับด้วย EMBEDDING_DAILY_TOKEN_CAP · ค่าเดียวกับ DEFAULT_EMBEDDING_DAILY_TOKEN_CAP
  alert_percent: 80  # ทับด้วย AI_BUDGET_ALERT_PERCENT
assistant:           # [ASSUMED] ต่อผู้ใช้ (ADR-023) · ทับด้วย ASSISTANT_MESSAGES_PER_HOUR / ASSISTANT_USER_DAILY_TOKENS / ASSISTANT_RETENTION_DAYS
  messages_per_hour: 30
  user_daily_tokens: 200000
  retention_days: 30
insights:            # [ASSUMED] AI ฝังในทุก element (ADR-029 §9.4) · ทับด้วย INSIGHT_<KEY ตัวใหญ่> เช่น INSIGHT_CALLS_PER_HOUR · ใช้ร่วมกับ app_ai_daily
  calls_per_hour: 6
  calls_per_day: 60
  daily_tokens: 150000
  stop_at_daily_percent: 60
  max_batch_elements: 4
  min_interval_minutes: 30
  debounce_minutes: 3
  max_wait_minutes: 15
  viewed_within_hours: 24
  narration_ttl_hours: 6
  builders_per_tick: 20
  user_scoped_calls_per_day: 30
  user_scoped_per_user_per_day: 4
  user_scoped_min_interval_minutes: 60
cloud_dev_usd_per_month: 20   # GCP ระหว่าง dev (Pub/Sub emulator/local ก่อนเป็นหลัก)
line_oa_plan: free            # 300 push/เดือน [VERIFY] — เปลี่ยนเมื่อ pilot จริง

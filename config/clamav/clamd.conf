# clamd settings for the Watchtower upload scan (ADR-022, T-155a). Mounted read-only over the image's own
# /etc/clamav/clamd.conf by docker-compose.yml (service `clamav`, profile `scan`).
#
# Why this file exists (security review T-155 C-2): ClamAV's defaults for AlertEncrypted*, AlertExceedsMax
# are "no" [VERIFY against https://docs.clamav.net/manual/Usage/Configuration.html#clamd for the pinned
# version], and with "no" a password-protected archive, or a file past the scan limits, is answered
# `OK`: the scanner never looked inside, yet the file would be marked clean and served. With "yes" clamd
# answers `Heuristics.Encrypted.* FOUND` / `Heuristics.Limits.Exceeded FOUND`, which the worker treats as
# infected (the file is removed). A customer who sends a password-protected zip is therefore refused;
# that is the intended trade-off.
#
# apps/worker/src/scan/clamd-config.test.ts checks that the Alert lines below stay "yes".

# --- listening: the container's own TCP port, reachable only on the `scan` network (worker + clamav) ---
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav

# --- log to the container's stdout ---
LogFile /dev/stdout
LogFileMaxSize 0
LogTime yes
LogClean no
LogVerbose no

# --- limits: INSTREAM total, and what is unpacked from one file ---
MaxThreads 12
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000

# --- what is looked into ---
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
ScanHTML yes
ScanMail yes

# --- a file the scanner could not look into is NOT clean (C-2) ---
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes

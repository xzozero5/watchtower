# Watchtower local stack (ADR-001: Docker Compose on one machine; the same images go to Cloud Run).
#
#   docker compose up -d --wait       everything, then http://localhost:8080 (caddy)
#   docker compose up -d --wait postgres redis minio minio-init mailpit
#                                     only the infrastructure, for `pnpm dev` and integration tests
#
# Works without a .env file: every value has a local default via ${VAR:-default}. Copy .env.example
# to .env to change ports or credentials. Every published port binds 127.0.0.1 only.
#
# Inside the network the containers always reach each other by service name, so DATABASE_URL,
# REDIS_URL, S3_ENDPOINT, SMTP_HOST and SMTP_PORT from .env are not passed through; they are built
# below (the mail relay from SMTP_RELAY_HOST / SMTP_RELAY_PORT, Mailpit by default).
#
# Everything the api and worker read from the environment is listed in x-app-env below; a test
# (packages/shared/src/compose-env.test.ts) fails when a variable the code reads is missing here.
# If you change POSTGRES_PASSWORD or APP_DB_PASSWORD, keep it URL-safe (letters and digits).
#
# The api and worker connect as the restricted login role APP_DB_USER (created by the `migrate` service),
# not as the database owner: no DDL, and no UPDATE/DELETE/TRUNCATE on the append-only audit log.

name: watchtower

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_URL: ${API_URL:-http://localhost:4000}
  DATABASE_URL: postgres://${APP_DB_USER:-watchtower_api}:${APP_DB_PASSWORD:-watchtower_api}@postgres:5432/${POSTGRES_DB:-watchtower}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-watchtower}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change-me-32-bytes-base64}
  APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
  APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
  APP_ENCRYPTION_KEY_PREVIOUS_VERSION: ${APP_ENCRYPTION_KEY_PREVIOUS_VERSION:-}
  CREDENTIAL_LIVE_TEST_ENABLED: ${CREDENTIAL_LIVE_TEST_ENABLED:-false}
  # Mail relay: Mailpit unless SMTP_RELAY_HOST says otherwise. 465 is implicit TLS, 587 is STARTTLS.
  # With NODE_ENV=production the worker refuses a plain or unauthenticated relay unless
  # SMTP_ALLOW_INSECURE=true. SMTP_USER and SMTP_PASSWORD are optional and are never logged.
  SMTP_HOST: ${SMTP_RELAY_HOST:-mailpit}
  SMTP_PORT: ${SMTP_RELAY_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
  SMTP_FROM: ${SMTP_FROM:-Watchtower <no-reply@example.com>}
  BREAK_GLASS_EMAIL: ${BREAK_GLASS_EMAIL:-}
  BREAK_GLASS_PASSWORD: ${BREAK_GLASS_PASSWORD:-}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
  SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-2592000}
  MAGIC_LINK_TTL_SECONDS: ${MAGIC_LINK_TTL_SECONDS:-900}
  # Mock sign-in is an explicit opt-in: off unless DEV_LOGIN_ENABLED=true (copy .env.example to
  # .env for local work). Ignored, and refused at boot, with Google credentials or in production.
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
  # Fake LINE Login: the same kind of opt-in (refused at boot in production or off a loopback APP_URL).
  LINE_LOGIN_FAKE_ENABLED: ${LINE_LOGIN_FAKE_ENABLED:-false}
  # Port 4000 is published directly here, so anyone can send the api a forged X-Forwarded-For and
  # it is not trusted (0): the audit log and rate limits use the socket address. Behind Caddy that
  # address is always Caddy's, which is wrong the other way round: use the proxy override
  #   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --wait
  # which does not publish :4000 and sets this to 1. The api logs a warning when it sees
  # X-Forwarded-For from a private address while this is 0.
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
  TICKET_KEY_PREFIX: ${TICKET_KEY_PREFIX:-OPS}
  DOCS_ENABLED: ${DOCS_ENABLED:-}
  REALTIME_REVALIDATE_SECONDS: ${REALTIME_REVALIDATE_SECONDS:-10}
  RATE_LIMIT_NAMESPACE: ${RATE_LIMIT_NAMESPACE:-wt}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  INGEST_CLASSIFIER_TIMEOUT_MS: ${INGEST_CLASSIFIER_TIMEOUT_MS:-3000}
  CLEANUP_AUTH_RETENTION_DAYS: ${CLEANUP_AUTH_RETENTION_DAYS:-7}
  CLEANUP_BREAK_GLASS_RETENTION_DAYS: ${CLEANUP_BREAK_GLASS_RETENTION_DAYS:-30}
  OUTBOUND_UNDO_SECONDS: ${OUTBOUND_UNDO_SECONDS:-5}
  PORTAL_TOKEN_SECRET: ${PORTAL_TOKEN_SECRET:-}
  PORTAL_TOKEN_TTL_DAYS: ${PORTAL_TOKEN_TTL_DAYS:-30}
  PORTAL_POW_DIFFICULTY_BITS: ${PORTAL_POW_DIFFICULTY_BITS:-18}
  PORTAL_POW_TTL_SECONDS: ${PORTAL_POW_TTL_SECONDS:-1800}
  PORTAL_MIN_FILL_SECONDS: ${PORTAL_MIN_FILL_SECONDS:-3}
  PORTAL_RATE_IP_PER_HOUR: ${PORTAL_RATE_IP_PER_HOUR:-20}
  PORTAL_RATE_EMAIL_PER_HOUR: ${PORTAL_RATE_EMAIL_PER_HOUR:-5}
  PORTAL_RATE_ORG_PER_HOUR: ${PORTAL_RATE_ORG_PER_HOUR:-60}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
  GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
  GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-example.com}
  # The key file is mounted read-only at this path (x-gmail-key below). The container is pointed at
  # it only when a host path is set; otherwise the variable stays empty and Gmail stays mock.
  GMAIL_SERVICE_ACCOUNT_JSON_PATH: ${GMAIL_SERVICE_ACCOUNT_JSON_PATH:+/run/secrets/gmail-service-account.json}
  GMAIL_IMPERSONATE_USER: ${GMAIL_IMPERSONATE_USER:-}
  # OAuth of the support mailbox (T-102e, the default way). All optional: the client ID and secret can be
  # saved on the admin page instead, and the refresh token is written by the OAuth callback. An environment
  # variable wins over a saved value and locks that field.
  GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
  GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
  GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
  GMAIL_OAUTH_MAILBOX: ${GMAIL_OAUTH_MAILBOX:-}
  PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-}
  PUBSUB_SUBSCRIPTION: ${PUBSUB_SUBSCRIPTION:-}
  # Gmail push (T-102b/c): topic for users.watch (worker), audience and signer of the push token (api).
  # Empty = mock: no watch is called and the receiver answers 503.
  PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-}
  PUBSUB_TOPIC: ${PUBSUB_TOPIC:-}
  GMAIL_PUSH_AUDIENCE: ${GMAIL_PUSH_AUDIENCE:-}
  GMAIL_PUSH_SERVICE_ACCOUNT: ${GMAIL_PUSH_SERVICE_ACCOUNT:-}
  # The in-memory Gmail (nothing is really sent): an explicit opt-in for a laptop, refused at boot in
  # production and on a non-loopback APP_URL. Off here: without a Gmail credential a reply fails visibly.
  GMAIL_MOCK_ENABLED: ${GMAIL_MOCK_ENABLED:-false}
  GMAIL_PUSH_RATE_PER_MINUTE: ${GMAIL_PUSH_RATE_PER_MINUTE:-600}
  GMAIL_HEARTBEAT_STALE_MINUTES: ${GMAIL_HEARTBEAT_STALE_MINUTES:-120}
  GMAIL_FULL_SYNC_DAYS: ${GMAIL_FULL_SYNC_DAYS:-7}
  GMAIL_FULL_SYNC_MAX_MESSAGES: ${GMAIL_FULL_SYNC_MAX_MESSAGES:-500}
  LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
  LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  DISCORD_ALERT_CHANNEL_ID: ${DISCORD_ALERT_CHANNEL_ID:-}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  DISCORD_WEBHOOK_URL_URGENT: ${DISCORD_WEBHOOK_URL_URGENT:-}
  DISCORD_CHANNEL_MAP: ${DISCORD_CHANNEL_MAP:-}
  DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
  DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
  # Phase 2 (T-200): empty = mock. Alert ingest (T-201c) and the status page switch (T-204).
  ALERT_PUSH_AUDIENCE: ${ALERT_PUSH_AUDIENCE:-}
  ALERT_PUSH_SERVICE_ACCOUNT: ${ALERT_PUSH_SERVICE_ACCOUNT:-}
  ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
  ALERT_HEARTBEAT_SECRET: ${ALERT_HEARTBEAT_SECRET:-}
  DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
  ALERT_INGEST_RATE_PER_MINUTE: ${ALERT_INGEST_RATE_PER_MINUTE:-600}
  STATUS_PAGE_PUBLIC: ${STATUS_PAGE_PUBLIC:-false}
  PRODUCT_DB_URL: ${PRODUCT_DB_URL:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
  GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_DAILY_COST_CAP_USD: ${AI_DAILY_COST_CAP_USD:-}
  AI_DAILY_TOKEN_CAP: ${AI_DAILY_TOKEN_CAP:-}
  AI_BUDGET_ALERT_PERCENT: ${AI_BUDGET_ALERT_PERCENT:-80}
  AI_READONLY_DATABASE_URL: ${AI_READONLY_DATABASE_URL:-}
  AI_TOOLS_WITHOUT_READONLY_LOGIN: ${AI_TOOLS_WITHOUT_READONLY_LOGIN:-false}
  AI_TOOL_FIXTURES_DIR: ${AI_TOOL_FIXTURES_DIR:-}
  ASSISTANT_MESSAGES_PER_HOUR: ${ASSISTANT_MESSAGES_PER_HOUR:-}
  ASSISTANT_USER_DAILY_TOKENS: ${ASSISTANT_USER_DAILY_TOKENS:-}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  KB_CRAWL_ALLOWED_HOSTS: ${KB_CRAWL_ALLOWED_HOSTS:-}
  KB_CHUNK_TARGET_CHARS: ${KB_CHUNK_TARGET_CHARS:-}
  KB_CHUNK_MAX_CHARS: ${KB_CHUNK_MAX_CHARS:-}
  KB_CHUNK_MIN_CHARS: ${KB_CHUNK_MIN_CHARS:-}
  KB_CHUNK_OVERLAP_CHARS: ${KB_CHUNK_OVERLAP_CHARS:-}
  KB_MIN_VECTOR_SIMILARITY: ${KB_MIN_VECTOR_SIMILARITY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
  VERTEX_LOCATION: ${VERTEX_LOCATION:-asia-southeast1}
  AI_MODEL_DEEP: ${AI_MODEL_DEEP:-}
  AI_MODEL_STANDARD: ${AI_MODEL_STANDARD:-}
  AI_MODEL_LIGHT: ${AI_MODEL_LIGHT:-}
  AI_MODEL_PRICES: ${AI_MODEL_PRICES:-}
  WEB_PUSH_VAPID_PUBLIC: ${WEB_PUSH_VAPID_PUBLIC:-}
  WEB_PUSH_VAPID_PRIVATE: ${WEB_PUSH_VAPID_PRIVATE:-}
  WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}

# Read-only mount of the Gmail service account key. GMAIL_SERVICE_ACCOUNT_JSON_PATH in .env is the
# path on THIS machine. Unset, the mount is an empty placeholder file and the container variable
# above is empty, so nothing reads it and Gmail stays mock.
x-gmail-key: &gmail-key
  type: bind
  source: ${GMAIL_SERVICE_ACCOUNT_JSON_PATH:-./config/no-credential}
  target: /run/secrets/gmail-service-account.json
  read_only: true

x-node-service: &node-service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    # pgvector on Postgres 16. Extensions are created by migration 0000, not by an init script.
    image: pgvector/pgvector:0.8.7-pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchtower}
      POSTGRES_DB: ${POSTGRES_DB:-watchtower}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  product-mock-init:
    # One-shot, local mock only (T-203c), behind the `product-mock` profile so a plain `docker compose up`
    # never creates it: `PRODUCT_MOCK_RO_PASSWORD=... docker compose --profile product-mock up product-mock-init`.
    # Creates the invented product database `product_mock` and its logins on this Postgres server (the
    # login `product_mock_ro`, NOINHERIT, and the group `product_mock_ro_reader` that holds the column
    # grants), loads examples/metrics (schema, seed with an anomaly, grants) and exits 0. Does nothing if
    # the database exists. It refuses to run without PRODUCT_MOCK_RO_PASSWORD: there is no default
    # password. Postgres is published on 127.0.0.1 only; do not publish it wider with this login in it.
    image: pgvector/pgvector:0.8.7-pg16-trixie
    profiles: ['product-mock']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-watchtower}
      PGPASSWORD: ${POSTGRES_PASSWORD:-watchtower}
      PRODUCT_MOCK_RO_PASSWORD: ${PRODUCT_MOCK_RO_PASSWORD:-}
    volumes:
      - ./examples/metrics:/metrics:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        if [ "$${#PRODUCT_MOCK_RO_PASSWORD}" -lt 12 ]; then
          echo 'Set PRODUCT_MOCK_RO_PASSWORD (at least 12 characters, letters and digits) for the mock login.' >&2
          exit 1
        fi
        case "$$PRODUCT_MOCK_RO_PASSWORD" in *[!A-Za-z0-9]*) echo 'PRODUCT_MOCK_RO_PASSWORD: letters and digits only.' >&2; exit 1;; esac
        if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'product_mock'" | grep -q 1; then
          echo 'product_mock exists'; exit 0
        fi
        psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE product_mock'
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'product_mock_ro_reader'" | grep -q 1 \
          || psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE product_mock_ro_reader NOLOGIN'
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'product_mock_ro'" | grep -q 1 \
          || psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE product_mock_ro LOGIN NOINHERIT PASSWORD '$$PRODUCT_MOCK_RO_PASSWORD'"
        psql -d product_mock -v ON_ERROR_STOP=1 -q -f /metrics/product-mock.schema.sql -f /metrics/product-mock.seed.sql -f /metrics/product_mock.sql
        psql -d product_mock -v ON_ERROR_STOP=1 -q -c "SELECT product_mock.seed(ARRAY['11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222']::uuid[])" >/dev/null
        sed -e 's/__RO_ROLE__/product_mock_ro/g' -e 's/__READER_ROLE__/product_mock_ro_reader/g' /metrics/product-mock.grants.sql | psql -d product_mock -v ON_ERROR_STOP=1 -q

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible object storage for local use; GCS replaces it on GCP. The upstream minio/minio
    # images were withdrawn from Docker Hub and Quay, so this defaults to a community fork.
    # Override with MINIO_IMAGE. See docs/04-ARCHITECTURE.md section 4.
    # Pinned by digest as well as tag (the tag stays for readability): a fork's tag can be moved, a
    # digest cannot. Update both together, then `docker image inspect --format
    # '{{index .RepoDigests 0}}' <image>` shows the new digest.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    # One-shot: creates the bucket, then exits 0.
    # Pinned by digest as well as tag, like minio above.
    image: ${MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8}
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null && mc mb --ignore-existing "local/$$S3_BUCKET"'
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      S3_BUCKET: ${S3_BUCKET:-watchtower}

  mailpit:
    # Local/dev only (ADR-002). Catches all outbound email; nothing leaves the machine.
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # One-shot: applies pending migrations (reversible, see packages/db) as the schema owner, then
    # creates or updates the restricted login role (APP_DB_USER) that api and worker use.
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    image: watchtower/api:local
    restart: 'no'
    command: ['node', 'node_modules/@watchtower/db/dist/cli.js', 'up']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-watchtower}:${POSTGRES_PASSWORD:-watchtower}@postgres:5432/${POSTGRES_DB:-watchtower}
      APP_DB_USER: ${APP_DB_USER:-watchtower_api}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-watchtower_api}
      # Optional: the AI tools' read-only login (watchtower_ai_ro). Both empty = not created.
      AI_DB_USER: ${AI_DB_USER:-}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *node-service
    build: *api-build
    image: watchtower/api:local
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      API_PORT: '4000'
    volumes:
      - *gmail-key
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: watchtower/worker:local
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      WORKER_PORT: '4100'
    volumes:
      - *gmail-key
    ports:
      - '127.0.0.1:${WORKER_PORT:-4100}:4100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    # apps/web/Dockerfile belongs to T-003. Contract: listens on 3000, GET /health returns 2xx.
    <<: *node-service
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: watchtower/web:local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The browser calls the API directly (cross-origin), so this must be reachable from the
      # host, never http://api:4000. The api allows CORS for APP_URL only.
      API_URL: ${API_URL:-http://localhost:4000}
      # The example ticket number in placeholders (OPS-12); the same value the api numbers tickets with.
      TICKET_KEY_PREFIX: ${TICKET_KEY_PREFIX:-OPS}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    # Local reverse proxy on http://localhost:8080 (TLS is the load balancer's job on GCP).
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CADDY_PORT:-8080}:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Starts after the api only. web is proxied lazily: until it is healthy caddy answers 502 for
    # pages, which keeps `docker compose up caddy` usable without building web.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:

# Run the whole stack behind the Caddy reverse proxy and nothing else (C-8).
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --wait
#   then open http://localhost:8080 (CADDY_PORT)
#
# What changes compared with the plain stack:
#   - api publishes no port: the only way in is Caddy, so a client cannot talk to the api directly
#     and forge X-Forwarded-For;
#   - TRUST_PROXY_HOPS=1: the api takes the client address from the header Caddy sets, so the audit
#     log, the per-IP rate limits and the break-glass lockout see the real client instead of Caddy's
#     address (which would let one noisy client lock everybody out);
#   - web, api and the emailed links all use one public address, PROXY_PUBLIC_URL, with the api under
#     /api (Caddy strips the prefix). One origin means no CORS. Set PROXY_PUBLIC_URL when Caddy is
#     reached by another name (it must be what the browser sees).
#
# Compose cannot remove a published port with a profile or a variable, which is why this is a
# second file. `!reset` needs Docker Compose 2.24 or newer.

x-public-url: &public-url ${PROXY_PUBLIC_URL:-http://localhost:8080}

services:
  api:
    ports: !reset []
    environment:
      TRUST_PROXY_HOPS: '1'
      APP_URL: *public-url
      API_URL: ${PROXY_PUBLIC_URL:-http://localhost:8080}/api

  worker:
    environment:
      APP_URL: *public-url
      API_URL: ${PROXY_PUBLIC_URL:-http://localhost:8080}/api

  web:
    environment:
      APP_URL: *public-url
      API_URL: ${PROXY_PUBLIC_URL:-http://localhost:8080}/api
